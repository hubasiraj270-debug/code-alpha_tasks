<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <div class="tabs">
      <button class="tab active">Calculator</button>
      <button class="tab">Converter</button>
    </div>
    <button class="menu">⋮</button>
  </header>

  <section class="display-area">
    <div id="expression"></div>
    <div id="display">0</div>
  </section>

  <section class="keypad">
    <button class="key orange" data-action="clear">AC</button>
    <button class="key orange" data-action="backspace">⌫</button>
    <button class="key orange" data-action="percent">%</button>
    <button class="key orange" data-value="÷">÷</button>

    <button class="key" data-value="7">7</button>
    <button class="key" data-value="8">8</button>
    <button class="key" data-value="9">9</button>
    <button class="key orange" data-value="×">×</button>

    <button class="key" data-value="4">4</button>
    <button class="key" data-value="5">5</button>
    <button class="key" data-value="6">6</button>
    <button class="key orange" data-value="−">−</button>

    <button class="key" data-value="1">1</button>
    <button class="key" data-value="2">2</button>
    <button class="key" data-value="3">3</button>
    <button class="key orange" data-value="+">+</button>

    <button class="key orange" data-action="sign">±</button>
    <button class="key" data-value="0">0</button>
    <button class="key" data-value=".">.</button>
    <button class="key equals" data-action="equals">=</button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
